name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · unit · build · ukuran (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Rentang `engines` akar (devDependency Angular 22 mensyaratkan ^22.22.3 || ^24.15.0 || >=26).
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Anggaran ukuran (loader ≤5 KB, aplikasi widget ≤60 KB gzip)
        run: pnpm size
      - name: Paket npm dapat diimpor di Node (ESM & CJS, SSR)
        run: pnpm --filter @plasgos/webchat smoke

  consumer:
    name: paket npm dapat diimpor di Node 20 (SSR situs tenant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Toolchain build butuh Node ≥ 22.22.3; paket yang terbit dipakai di Node tenant yang lebih lama.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plasgos/webchat build
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node packages/webchat/scripts/smoke-consume.mjs

  e2e:
    name: e2e fixture (${{ matrix.project }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: iphone, browser: webkit }
          - { project: android, browser: chromium }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm e2e --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/

  apps:
    name: e2e aplikasi meta-framework (Next 14/15, React Router, Nuxt, Angular SSR, SvelteKit, Astro)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Kemas paket & build produksi tiap aplikasi
        run: pnpm apps:build
      - run: pnpm lint:apps
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm e2e:apps
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-apps
          path: |
            playwright-report/
            test-results/

  perf:
    name: Lighthouse (dengan vs tanpa widget)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: .lighthouse/
