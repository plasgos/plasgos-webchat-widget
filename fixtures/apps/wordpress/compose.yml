# Fixture matriks: WordPress sungguhan + plugin Plasgos CRM (repo tetangga plasgos-wordpress) yang memasang widget.
# Dijalankan oleh start.sh (Playwright `pnpm e2e:wordpress`); loader & iframe stub dari server fixture :4400.
name: plasgos-webchat-wordpress

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40

  wordpress:
    image: wordpress:${WP_TAG:-php8.3-apache}
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', '/tmp/wp-debug.log');
        define('WP_DEBUG_DISPLAY', false);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_AUTO_UPDATE_CORE', false);
        define('DISABLE_WP_CRON', true);
        define('WP_HOME', 'http://localhost:4518');
        define('WP_SITEURL', 'http://localhost:4518');
        define('PLASGOS_CRM_WEBCHAT_WIDGET_ID', 'wgt_0123456789abcdef01234567');
        define('PLASGOS_CRM_WEBCHAT_IDENTITY_SECRET', 'wcs_fixtureSecretFixtureSecretFixture');
        define('PLASGOS_CRM_WEBCHAT_LOADER_URL', 'http://localhost:4400/loader/v1/loader.js');
        define('PLASGOS_CRM_WEBCHAT_WIDGET_ORIGIN', 'http://127.0.0.1:4400');
    ports:
      - "127.0.0.1:4518:80"
    volumes:
      - wp:/var/www/html
      - ${PLASGOS_WORDPRESS_DIR:?isi PLASGOS_WORDPRESS_DIR}:/var/www/html/wp-content/plugins/plasgos-crm:ro

  cli:
    image: wordpress:${CLI_TAG:-cli-2.12-php8.3}
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ${PLASGOS_WORDPRESS_DIR}:/var/www/html/wp-content/plugins/plasgos-crm:ro
    entrypoint: ["sleep", "infinity"]

volumes:
  wp:
