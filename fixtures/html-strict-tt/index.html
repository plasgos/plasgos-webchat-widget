<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fixture — Trusted Types wajib, tanpa skrip inline</title>
    <!-- Bentuk pemasangan TANPA inline (§3) untuk situs yang melarang skrip inline & mewajibkan Trusted Types.
         Snippet inline tak bisa dipakai di sini: ia mengisi `script.src` dengan string (sink Trusted Types). -->
    <script async src="/packages/loader/dist/loader.js"
            data-widget-id="wgt_0123456789abcdef01234567"
            data-auto-boot="true"
            data-widget-origin="http://127.0.0.1:4400"></script>
</head>
<body>
    <main><h1>Website dengan Trusted Types</h1></main>
</body>
</html>
